apiVersion: garm-operator.mercedes-benz.com/v1beta1
kind: ScaleSet
metadata:
  name: scaleset-sample
spec:
  githubScopeRef:
    apiGroup: garm-operator.mercedes-benz.com
    kind: Organization
    name: github-actions
  enabled: true
  providerName: openstack
  image: runner-default
  flavor: medium
  osType: linux
  osArch: amd64
  maxRunners: 20
  minIdleRunners: 2
  runnerBootstrapTimeout: 20
  labels:
    - ubuntu-22.04
    - x64
  runnerSchedule:
    timeZone: America/Chicago
    ranges:
      - days: [Monday, Tuesday, Wednesday, Thursday, Friday]
        start: "08:00"
        end: "18:00"
        minIdleRunners: 5
      - days: [Saturday]
        start: "22:00"
        end: "06:00"
        minIdleRunners: 2
